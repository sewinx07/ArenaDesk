services:
  - type: web
    name: arenadesk-api
    env: node
    region: ohio
    plan: free
    branch: main
    repo: https://github.com/YOUR_USER/ArenaDeskOS
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      # DATABASE_URL: Neon POOLED connection string (with -pooler)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_SALT_ROUNDS
        value: '12'
      - key: CORS_ORIGIN
        value: https://your-frontend.vercel.app

databases:
  - name: arenadesk-db
    plan: free
    region: ohio
    databaseName: arenadesk_os
    ipAllowList: []
